header:
  version: 11
machine: "imx91frdm"
distro: poky
target:
  - imx91-frdm-demo-image
repos:
  # It's current revision will be used to perform the build.
  meta-imx91-frdm:
  poky:
    path: "layers/poky"
    url: "https://git.yoctoproject.org/git/poky"
    branch: scarthgap
    path: "layers"
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:
  meta-openembedded:
    url: "https://github.com/openembedded/meta-openembedded.git"
    branch: scarthgap
    path: "layers/meta-openembedded"
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-perl:
      meta-python:
      meta-multimedia:
      meta-filesystems:
      meta-webserver:
  meta-arm:
    url: "https://git.yoctoproject.org/meta-arm.git"
    branch: scarthgap
    path: "layers/meta-arm"
    layers:
      meta-arm:
      meta-arm-bsp:
      meta-arm-toolchain:
  meta-imx:
    url: "https://github.com/nxp-imx/meta-imx.git"
    branch: scarthgap-6.6.52-2.2.0
    path: "layers/meta-imx"
    layers:
      meta-imx-bsp:
  meta-freescale:
    url: "https://git.yoctoproject.org/git/meta-freescale.git"
    branch: scarthgap
    path: "layers/meta-freescale"
local_conf_header:
  standard: |
    CONF_VERSION = "2"
    INHERIT += "rm_work"
    PACKAGE_CLASSES = "package_deb"
    DISTRO_FEATURES += "systemd usrmerge wifi"
    VIRTUAL-RUNTIME_init_manager = "systemd"
    DISTRO_FEATURES_BACKFILL_CONSIDERED += "sysvinit"
  debug-tweaks: |
    EXTRA_IMAGE_FEATURES = "debug-tweaks"
  sdk: |
    SDKMACHINE = "x86_64"
  license_flags: |
    ACCEPT_FSL_EULA = "1"
