# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "imx91-frdm"
BBFILE_PATTERN_imx91-frdm := "^${LAYERDIR}/"
BBFILE_PRIORITY_imx91-frdm = "8"
LAYERSERIES_COMPAT_imx91-frdm = "scarthgap"
LAYERDEPENDS_imx91-frdm = "core openembedded-layer"

# Exclude conflicting recipes from being processed
BBMASK += "/meta-imx-bsp/recipes-bsp/firmware-imx/firmware-nxp-wifi_%.bbappend"
